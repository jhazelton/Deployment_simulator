# This is a workflow to checkout the repo, setup python, run the deployment simulator, run unit tests, and
# build a docker image.

name: Deployment_Simulator_CI_CD

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "main" branch
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      #Step 1: Download code from repository.
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - name: Checkout repository code
        uses: actions/checkout@v7

      # Step 2: Ensure/Install Python 3
      - name: Setup Python 3
        uses: actions/setup-python@v6
        with: 
          python-version: '3.14.4'

      # Step 3: Verify the installation
      - name: Display python version
        run: python3 --version
      
      # Step 4:  Run the deployment simulator python script.
      - name: Run Deployment Simulator
        run: python3 jim_dply3.py

      # Step 5:  Install dependencies for pytest
      - name: Install dependencies
        run: pip install pytest

      # Step 6:  Run unit tests with pytest
      - name: Run Unit tests with pytest
        run: pytest
        env:
          PYTHONPATH: .  # Instructing Python to include the root directory in its search path
      
      # Step 7:  perform unit tests using pytest
      - name: Run a multi-line script
        run: |
          echo Add other actions to run unit test using pytest.
          echo add another set of testing.

      # Step 8: Authenticate safely into your cloud Docker registry
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Step 9: Compile your application and context via your Dockerfile layout
      - name: Build and Tag Docker Image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/deployment-simulator:latest .

      # Step 10: Securely publish your image to your Docker Hub repository registry
      - name: Push Image to Docker Hub Registry
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/deployment-simulator:latest
